name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: 測試與程式碼品質檢查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli-core knack requests colorama humanfriendly
          pip install pylint flake8 pytest
          pip install -e deploy-to-azure/

      - name: 執行 pytest
        run: pytest deploy-to-azure/azext_deploy_to_azure/tests/ -v

      - name: 執行 pylint
        run: python -m pylint --rcfile pylintrc ./deploy-to-azure/azext_deploy_to_azure -f colorized

      - name: 執行 flake8
        # flake8 設定檔含舊式行內註解，改以命令列傳遞等效選項
        run: |
          python -m flake8 --isolated \
            --max-line-length=120 \
            --extend-ignore=E501,E722,F401,F811,C901,W504,F841 \
            --exclude=tests,build,tools,scripts,doc,build_scripts \
            deploy-to-azure/azext_deploy_to_azure

  build-wheel:
    name: 建立 wheel 安裝包
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝建置工具
        run: pip install "setuptools>=75" wheel

      - name: 建立 wheel
        run: |
          cd deploy-to-azure
          python setup.py bdist_wheel

      - name: 驗證 wheel 內容
        run: |
          python -m zipfile -l deploy-to-azure/dist/*.whl | grep -E "(locale|messages|zh_TW)"

      - name: 上傳 wheel 成品
        uses: actions/upload-artifact@v4
        with:
          name: deploy-to-azure-wheel
          path: deploy-to-azure/dist/*.whl
